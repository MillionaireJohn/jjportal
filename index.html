const calcH=(s,e)=>{if(!s||!e)return 0;const[sh,sm]=s.split(":").map(Number);const[eh,em]=e.split(":").map(Number);return Math.max(0,(eh*60+em-sh*60-sm)/60);};
const fmt=(t)=>{if(!t)return"";const[h,m]=t.split(":").map(Number);return`${h%12||12}${m?`:${String(m).padStart(2,"0")}`:""} ${h>=12?"pm":"am"}`;};
const toKey=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;

const gi=name=>name.trim().split(/\s+/).map(n=>n[0]).join("").toUpperCase().slice(0,2);
const weekOf=anchor=>{const d=new Date(anchor),dow=d.getDay(),mon=new Date(d);mon.setDate(d.getDate()-(dow===0?6:dow-1));return Array.from({length:7},(_,i)=>{const x=new Date(mon);x.setDate(mon.getDate()+i);return x;});};
const isWeekendDay=date=>{const d=date.getDay();return d===0||d===6;};
const getRate=(staff,date,isPH)=>{const we=isWeekendDay(date);if(isPH)return we?(staff.ratePHWeekend||staff.hourlyRate):(staff.ratePHWeekday||staff.hourlyRate);return we?(staff.rateWeekend||staff.hourlyRate):(staff.rateWeekday||staff.hourlyRate);};
const getRateLabel=(date,isPH)=>{const we=isWeekendDay(date);if(isPH)return we?"PH Weekend":"PH Weekday";return we?"Weekend":"Weekday";};

const tgPhoto=async(b64,caption)=>{try{const raw=b64.split(",")[1];const bytes=atob(raw);const arr=new Uint8Array(bytes.length);for(let i=0;i<bytes.length;i++)arr[i]=bytes.charCodeAt(i);const blob=new Blob([arr],{type:"image/jpeg"});await Promise.all(TG_CHATS.map(chat=>{const fd=new FormData();fd.append("chat_id",chat);fd.append("photo",blob,"clock.jpg");fd.append("caption",caption);fd.append("parse_mode","HTML");return fetch(`https://api.telegram.org/bot${TG_TOKEN}/sendPhoto`,{method:"POST",body:fd});}));}catch(e){console.error("TG Photo",e);}};
const stamp=(canvas,ctx,name,type)=>{const now=new Date();const ts=now.toLocaleString("en-MY",{year:"numeric",month:"short",day:"numeric",hour:"2-digit",minute:"2-digit",second:"2-digit"});const hh=canvas.height,cw=canvas.width;ctx.fillStyle="rgba(0,0,0,0.72)";ctx.fillRect(0,hh-90,cw,90);ctx.font=`bold ${Math.max(16,Math.min(cw/18,26))}px Arial`;ctx.fillStyle=type==="in"?"#4EC94E":"#FF6B6B";ctx.fillText(`${type==="in"?"🟢 CLOCK IN":"🔴 CLOCK OUT"} — ${name}`,10,hh-54);ctx.font=`${Math.max(13,Math.min(cw/24,20))}px Arial`;ctx.fillStyle="white";ctx.fillText(ts,10,hh-18);};

// ── Auto-Schedule Helpers ─────────────────────────────────
const AUTO_SCHEDULE_EXCLUDED=["0","6","7","8"]; // John, Joey, Jaclyn, James

const getNextWeekMonday=()=>{
  const today=new Date();
  const day=today.getDay(); // 0=Sun,6=Sat
  let daysToMon=day===0?1:day===6?2:(8-day);
  const mon=new Date(today);
  mon.setDate(today.getDate()+daysToMon);
  mon.setHours(0,0,0,0);
  return mon;
};

const getWeekDatesFrom=monday=>{
  return Array.from({length:7},(_,i)=>{const d=new Date(monday);d.setDate(monday.getDate()+i);return d;});
};

const getSlots=date=>{
  const isWE=date.getDay()===0||date.getDay()===6;
  return[
    {slot:"morning",start:isWE?"11:00":"10:30",end:"16:30",label:isWE?"11am–4:30pm":"10:30am–4:30pm"},
    {slot:"evening",start:"16:30",end:"22:00",label:"4:30pm–10pm"},
  ];
};

const isSubmissionWindow=()=>{
  const day=new Date().getDay();
  return day===6||day===0; // Saturday or Sunday
};

const generateAutoSchedule=(weekDates,availabilities,staff)=>{
  const eligible=staff.filter(s=>!AUTO_SCHEDULE_EXCLUDED.includes(s.id));
  const unfilled=[];
  const shifts=[];

  weekDates.forEach(date=>{
    const dateKey=toKey(date);
    getSlots(date).forEach(({slot,start,end,label})=>{
      // Find eligible staff available for this slot
      const avail=availabilities.filter(a=>
        a.date===dateKey&&(a.slot===slot||a.slot==="both")&&
        eligible.find(s=>s.id===a.staffId)
      );
      if(avail.length===0){
        unfilled.push({date,label});
      }else{
        // Randomly pick one
        const picked=avail[Math.floor(Math.random()*avail.length)];
        shifts.push({id:Date.now().toString()+Math.random().toString(36).slice(2),staffId:picked.staffId,start,end,note:"",isPH:false,date:dateKey});
      }
    });
  });

  return{shifts,unfilled};
};

const buildTelegramMsg=(weekDates,shifts,unfilled,staff)=>{
  const mon=weekDates[0];
  const sun=weekDates[6];
  let msg=`🗓️ <b>Auto Schedule Generated!</b>
Week: ${mon.getDate()}/${mon.getMonth()+1} – ${sun.getDate()}/${sun.getMonth()+1}

`;

  weekDates.forEach(date=>{
    const dateKey=toKey(date);
    const dayShifts=shifts.filter(s=>s.date===dateKey);
    const dayName=date.toLocaleDateString("en-MY",{weekday:"short"});
    msg+=`<b>${date.getDate()}/${date.getMonth()+1} ${dayName}</b>
`;
    getSlots(date).forEach(({slot,label})=>{
      const sh=dayShifts.find(s=>s.start===(slot==="morning"?(date.getDay()===0||date.getDay()===6?"11:00":"10:30"):"16:30"));
      const staffName=sh?staff.find(x=>x.id===sh.staffId)?.name:"—";
      msg+=`  ${slot==="morning"?"🌅":"🌆"} ${label}: ${staffName}
`;
    });
    msg+="
";
  });

  if(unfilled.length>0){
    msg+=`⚠️ <b>Unfilled slots (${unfilled.length}):</b>
`;
    unfilled.forEach(u=>{
      msg+=`  • ${u.date.getDate()}/${u.date.getMonth()+1} ${u.date.toLocaleDateString("en-MY",{weekday:"short"})} — ${u.label}
`;
    });
  }else{
    msg+="✅ All slots filled!";
  }
  msg+="

— JJ Portal · Ningji Lemon Tea";
  return msg;
};

// ── Clock Modal (WITH FLIP CAMERA) ───────────────────────
function ClockModal({staffId,staffName,type,onSave,onClose}){
  const[step,setStep]=useState("choose");
  const[photo,setPhoto]=useState(null);
  const[note,setNote]=useState("");
  const[saving,setSaving]=useState(false);
  const[camErr,setCamErr]=useState("");
  const[facing,setFacing]=useState("user");
  const vref=useRef(null),sref=useRef(null);
  const stopCam=()=>{if(sref.current){sref.current.getTracks().forEach(t=>t.stop());sref.current=null;}};
  const startCam=async(facingMode="user")=>{
    setCamErr("");stopCam();
    if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){setCamErr("Camera not supported. Please use Upload.");return;}
    try{
      let stream;
      try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:facingMode}},audio:false});}
      catch(e){stream=await navigator.mediaDevices.getUserMedia({video:true,audio:false});}
      sref.current=stream;setFacing(facingMode);setStep("camera");
      setTimeout(()=>{if(vref.current){vref.current.srcObject=stream;vref.current.play().catch(()=>{});}},100);
    }catch(e){
      let msg="Camera access denied.";
      if(e.name==="NotFoundError")msg="No camera found.";
      else if(e.name==="NotAllowedError")msg="Camera permission denied. Allow in browser settings.";
      else if(e.name==="NotReadableError")msg="Camera in use by another app.";
      setCamErr(msg+" Please use Upload instead.");
    }
  };
  const flipCam=()=>startCam(facing==="user"?"environment":"user");
  const compressPhoto=(srcCanvas)=>{
    // Resize to max 480px and compress heavily — selfies for attendance don't need high res
    const MAX=480;
    let w=srcCanvas.width,h=srcCanvas.height;
    if(w>MAX||h>MAX){const r=Math.min(MAX/w,MAX/h);w=Math.floor(w*r);h=Math.floor(h*r);}
    const out=document.createElement("canvas");out.width=w;out.height=h;
    out.getContext("2d").drawImage(srcCanvas,0,0,w,h);
    return out;
  };
  const snap=()=>{
    const v=vref.current;if(!v)return;
    const c=document.createElement("canvas");c.width=v.videoWidth||640;c.height=v.videoHeight||480;
    const ctx=c.getContext("2d");
    if(facing==="user"){ctx.translate(c.width,0);ctx.scale(-1,1);}
    ctx.drawImage(v,0,0);
    if(facing==="user"){ctx.setTransform(1,0,0,1,0,0);}
    const compressed=compressPhoto(c);
    stamp(compressed,compressed.getContext("2d"),staffName,type);
    setPhoto(compressed.toDataURL("image/jpeg",0.35));
    stopCam();setStep("preview");
  };
  const upload=e=>{
    const f=e.target.files[0];if(!f)return;
    const r=new FileReader();
    r.onload=()=>{
      const img=new Image();
      img.onload=()=>{
        const c=document.createElement("canvas");c.width=img.width;c.height=img.height;
        const ctx=c.getContext("2d");ctx.drawImage(img,0,0);
        const compressed=compressPhoto(c);
        stamp(compressed,compressed.getContext("2d"),staffName,type);
        setPhoto(compressed.toDataURL("image/jpeg",0.35));
        setStep("preview");
      };img.src=r.result;
    };r.readAsDataURL(f);
  };
  const confirm=async()=>{
    setSaving(true);
    const record={id:Date.now().toString(),staffId,type,photo,timestamp:new Date().toISOString(),note};
    try{
      await db.addClock(record);
      onSave(record);
    }catch(e){
      setSaving(false);
      alert("Failed to save. Please check your internet and try again.");
      return;
    }
    const now=new Date();
    const timeStr=now.toLocaleString("en-MY",{hour:"2-digit",minute:"2-digit"});
    const dateStr=now.toLocaleDateString("en-MY",{weekday:"short",month:"short",day:"numeric"});
    const caption=`${type==="in"?"🟢":"🔴"} <b>${staffName}</b> ${type==="in"?"clocked IN ✅":"clocked OUT 🔴"}\n⏰ ${timeStr} · ${dateStr}${note?`\n📝 ${note}`:""}\n\n— JJ Portal · Ningji`;
    if(photo)await tgPhoto(photo,caption);else await tg(caption);
    setSaving(false);onClose();
  };
  useEffect(()=>()=>stopCam(),[]);
  return(
    <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,.65)",display:"flex",alignItems:"center",justifyContent:"center",zIndex:500,padding:20}}>
      <div style={{background:"white",borderRadius:20,padding:28,width:400,maxHeight:"92vh",overflowY:"auto",boxShadow:"0 24px 80px rgba(0,0,0,.3)"}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:20}}>
          <h3 style={{fontSize:18,fontWeight:700,color:"#1A2E1B"}}>{type==="in"?"🟢 Clock In":"🔴 Clock Out"} — {staffName}</h3>
          <button onClick={()=>{stopCam();onClose();}} style={{background:"none",border:"none",cursor:"pointer",fontSize:20,color:"#6B7B6C"}}>✕</button>
        </div>
        {camErr&&<div style={{background:"#FEF2F2",border:"1.5px solid #FCA5A5",borderRadius:10,padding:"10px 14px",marginBottom:14,color:"#EF4444",fontSize:13}}>{camErr}</div>}
        {step==="choose"&&(
          <div>
            <p style={{color:"#6B7B6C",fontSize:13,marginBottom:16}}>Take or upload a photo. It will be sent to manager via Telegram.</p>
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12,marginBottom:10}}>
              <button onClick={()=>startCam("user")} style={{...Btn("primary",{flexDirection:"column",padding:"20px 14px",height:100,justifyContent:"center",borderRadius:12}),fontSize:12}}>
                <span style={{fontSize:28,marginBottom:8}}>🤳</span>Selfie
              </button>
              <button onClick={()=>startCam("environment")} style={{...Btn("sec",{flexDirection:"column",padding:"20px 14px",height:100,justifyContent:"center",borderRadius:12}),fontSize:12}}>
                <span style={{fontSize:28,marginBottom:8}}>📷</span>Back Camera
              </button>
            </div>

          </div>
        )}
        {step==="camera"&&(
          <div>
            <div style={{position:"relative",marginBottom:12}}>
              <video ref={vref} autoPlay playsInline muted style={{width:"100%",borderRadius:12,background:"#000",maxHeight:300,objectFit:"cover",display:"block",transform:facing==="user"?"scaleX(-1)":"none"}}/>
              <button onClick={flipCam} title="Flip Camera" style={{position:"absolute",top:10,right:10,background:"rgba(0,0,0,0.55)",border:"2px solid rgba(255,255,255,0.3)",borderRadius:"50%",width:42,height:42,cursor:"pointer",fontSize:20,display:"flex",alignItems:"center",justifyContent:"center",color:"white"}}>🔄</button>
              <div style={{position:"absolute",bottom:10,left:"50%",transform:"translateX(-50%)",background:"rgba(0,0,0,0.5)",color:"white",fontSize:10,padding:"3px 10px",borderRadius:20}}>{facing==="user"?"Front Camera":"Back Camera"}</div>
            </div>
            <div style={{display:"flex",gap:10}}>
              <button onClick={()=>{stopCam();setStep("choose");}} style={{...Btn("sec",{flex:1,justifyContent:"center"})}}>Cancel</button>
              <button onClick={snap} style={{...Btn("primary",{flex:2,justifyContent:"center",padding:14,borderRadius:12})}}>📸 Capture</button>
            </div>
          </div>
        )}
        {step==="preview"&&photo&&(
          <div>
            <img src={photo} style={{width:"100%",borderRadius:12,marginBottom:14}} alt=""/>
            <textarea placeholder="Optional note..." value={note} onChange={e=>setNote(e.target.value)} style={{...Inp(),height:68,resize:"none",marginBottom:12}}/>
            <div style={{display:"flex",gap:10}}>
              <button onClick={()=>{setPhoto(null);setStep("choose");}} style={{...Btn("sec",{flex:1,justifyContent:"center"})}}>Retake</button>
              <button onClick={confirm} disabled={saving} style={{...Btn("primary",{flex:2,justifyContent:"center",background:"linear-gradient(135deg,#3DB54A,#1A7A2C)"}),opacity:saving?.7:1}}>
                {saving?"Sending...":type==="in"?"✅ Confirm Clock In":"✅ Confirm Clock Out"}
              </button>
            </div>
          </div>
        )}
      </div>
    </div>
  );
}

// ── Complaint Modal ───────────────────────────────────────
function ComplaintModal({staffId,staffName,onSave,onClose}){
  const[step,setStep]=useState("form");
  const[photo,setPhoto]=useState(null);
  const[note,setNote]=useState("");
  const[saving,setSaving]=useState(false);
  const[done,setDone]=useState(false);
  const vref=useRef(null),sref=useRef(null);
  const stopCam=()=>{if(sref.current){sref.current.getTracks().forEach(t=>t.stop());sref.current=null;}};
  const startCam=async()=>{
    try{
      let stream;
      try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:"environment"}},audio:false});}
      catch(e){stream=await navigator.mediaDevices.getUserMedia({video:true,audio:false});}
      sref.current=stream;
      setStep("camera");
      setTimeout(()=>{if(vref.current){vref.current.srcObject=stream;vref.current.play().catch(()=>{});}},100);
    }catch(e){alert("Camera not available. Please use Upload.");}
  };
  const snap=()=>{const v=vref.current;const c=document.createElement("canvas");c.width=v.videoWidth||640;c.height=v.videoHeight||480;const ctx=c.getContext("2d");ctx.drawImage(v,0,0);setPhoto(c.toDataURL("image/jpeg",.85));stopCam();setStep("form");};
  const upload=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>setPhoto(r.result);r.readAsDataURL(f);};
  const submit=async()=>{
    if(!note.trim()){alert("Please describe the issue.");return;}
    if(!photo){alert("Please attach a photo.");return;}
    setSaving(true);
    const rec={id:Date.now().toString(),staffId,staffName,photo,note,timestamp:new Date().toISOString(),resolved:false};
    await db.addComplaint(rec);onSave(rec);setSaving(false);setDone(true);
  };
  useEffect(()=>()=>stopCam(),[]);
  if(done)return(<div style={{position:"fixed",inset:0,background:"rgba(0,0,0,.65)",display:"flex",alignItems:"center",justifyContent:"center",zIndex:500}}><div style={{background:"white",borderRadius:20,padding:"40px 32px",textAlign:"center",width:320,boxShadow:"0 24px 80px rgba(0,0,0,.3)"}}><div style={{fontSize:56,marginBottom:16}}>✅</div><h3 style={{fontSize:20,fontWeight:700,color:"#1A2E1B",marginBottom:8}}>Report Submitted!</h3><p style={{color:"#6B7B6C",fontSize:14,marginBottom:24}}>Manager has been notified. Thank you!</p><button onClick={onClose} style={{...Btn("primary",{width:"100%",justifyContent:"center",padding:13,borderRadius:12})}}>Done</button></div></div>);
  return(
    <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,.65)",display:"flex",alignItems:"center",justifyContent:"center",zIndex:500,padding:20}}>
      <div style={{background:"white",borderRadius:20,padding:28,width:400,maxHeight:"90vh",overflowY:"auto",boxShadow:"0 24px 80px rgba(0,0,0,.3)"}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:20}}><h3 style={{fontSize:18,fontWeight:700,color:"#1A2E1B"}}>📋 Store Report</h3><button onClick={()=>{stopCam();onClose();}} style={{background:"none",border:"none",cursor:"pointer",fontSize:20,color:"#6B7B6C"}}>✕</button></div>
        {step==="camera"?(<div><video ref={vref} autoPlay playsInline muted style={{width:"100%",borderRadius:12,marginBottom:12,background:"#000",maxHeight:260,objectFit:"cover",display:"block"}}/><div style={{display:"flex",gap:10}}><button onClick={()=>{stopCam();setStep("form");}} style={{...Btn("sec",{flex:1,justifyContent:"center"})}}>Cancel</button><button onClick={snap} style={{...Btn("primary",{flex:2,justifyContent:"center"})}}>📸 Capture</button></div></div>):(<div>
          <p style={{color:"#6B7B6C",fontSize:13,marginBottom:14}}>Describe the issue and attach a photo.</p>
          <div style={{marginBottom:14}}><label style={{fontSize:12,fontWeight:600,color:"#1A2E1B",display:"block",marginBottom:8}}>📸 Photo (required)</label>
            {photo?(<div style={{position:"relative"}}><img src={photo} style={{width:"100%",borderRadius:10,maxHeight:150,objectFit:"cover"}} alt=""/><button onClick={()=>setPhoto(null)} style={{position:"absolute",top:8,right:8,background:"rgba(0,0,0,.6)",color:"white",border:"none",borderRadius:"50%",width:28,height:28,cursor:"pointer",fontSize:14}}>✕</button></div>):(<div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}><button onClick={startCam} style={{...Btn("sec",{flexDirection:"column",padding:14,height:72,justifyContent:"center",borderRadius:10}),fontSize:12}}><span style={{fontSize:22,marginBottom:4}}>📸</span>Camera</button><label style={{...Btn("sec",{flexDirection:"column",padding:14,height:72,justifyContent:"center",cursor:"pointer",borderRadius:10}),fontSize:12}}><span style={{fontSize:22,marginBottom:4}}>📁</span>Upload<input type="file" accept="image/*" capture="environment" onChange={upload} style={{display:"none"}}/></label></div>)}
          </div>
          <div style={{marginBottom:14}}><label style={{fontSize:12,fontWeight:600,color:"#1A2E1B",display:"block",marginBottom:6}}>📝 Describe the issue (required)</label><textarea placeholder="e.g. POS not working, lightbulb broken..." value={note} onChange={e=>setNote(e.target.value)} style={{...Inp(),height:80,resize:"none"}}/></div>
          <button onClick={submit} disabled={saving||!note.trim()||!photo} style={{...Btn("primary",{width:"100%",justifyContent:"center",padding:13,borderRadius:12,background:"linear-gradient(135deg,#3DB54A,#1A7A2C)"}),opacity:saving||!note.trim()||!photo?.6:1}}>{saving?"Submitting...":"📤 Submit Report"}</button>
        </div>)}
      </div>
    </div>
  );
}


// ── Availability Section (Staff) ─────────────────────────
function AvailabilitySection({staffId}){
  const[avail,setAvail]=useState({}); // {dateKey: 'none'|'morning'|'evening'|'both'}
  const[loading,setLoading]=useState(true);
  const[saving,setSaving]=useState(false);
  const[saved,setSaved]=useState(false);
  const isWindow=isSubmissionWindow();
  const nextMon=getNextWeekMonday();
  const weekStr=toKey(nextMon);
  const weekDates=getWeekDatesFrom(nextMon);

  useEffect(()=>{
    (async()=>{
      setLoading(true);
      const data=await db.getAvailability(weekStr);
      const mine=data.filter(a=>a.staffId===staffId);
      const map={};
      mine.forEach(a=>{map[a.date]=a.slot;});
      // Default all days to 'none'
      weekDates.forEach(d=>{if(!map[toKey(d)])map[toKey(d)]="none";});
      setAvail(map);
      setLoading(false);
    })();
  },[]);

  const submit=async()=>{
    setSaving(true);
    const entries=Object.entries(avail).map(([date,slot])=>({date,slot}));
    await db.submitAvailability(staffId,weekStr,entries);
    setSaving(false);setSaved(true);
    setTimeout(()=>setSaved(false),3000);
  };

  const mon=weekDates[0],sun=weekDates[6];
  const slotOptions=[
    {v:"none",l:"❌ Not Available"},
    {v:"morning",l:"🌅 Morning"},
    {v:"evening",l:"🌆 Evening"},
    {v:"both",l:"✅ Both"},
  ];

  return(
    <div style={{...Card(),marginBottom:16}}>
      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:12}}>
        <div>
          <h3 style={{margin:"0 0 2px",fontSize:14,fontWeight:700,color:"#1A2E1B"}}>📆 My Availability</h3>
          <p style={{margin:0,fontSize:11,color:"#6B7B6C"}}>
            Week: {mon.getDate()}/{mon.getMonth()+1} – {sun.getDate()}/{sun.getMonth()+1}
            {!isWindow&&<span style={{marginLeft:6,color:"#F59E0B",fontWeight:600}}>(Submit Sat–Sun only)</span>}
          </p>
        </div>
        {saved&&<span style={{color:"#2EAD3F",fontSize:12,fontWeight:600}}>✅ Saved!</span>}
      </div>
      {loading?(
        <p style={{color:"#6B7B6C",fontSize:13}}>Loading...</p>
      ):(
        <>
          {weekDates.map(date=>{
            const dk=toKey(date);
            const isWE=date.getDay()===0||date.getDay()===6;
            const dayLabel=date.toLocaleDateString("en-MY",{weekday:"short"});
            const dateLabel=`${date.getDate()}/${date.getMonth()+1}`;
            return(
              <div key={dk} style={{display:"flex",alignItems:"center",justifyContent:"space-between",padding:"8px 0",borderBottom:"1px solid #F0F7F0"}}>
                <div style={{minWidth:90}}>
                  <span style={{fontSize:13,fontWeight:600,color:"#1A2E1B"}}>{dayLabel} {dateLabel}</span>
                  {isWE&&<span style={{marginLeft:5,fontSize:9,background:"#E8F8EA",color:"#2EAD3F",padding:"1px 5px",borderRadius:4,fontWeight:700}}>WE</span>}
                </div>
                <select
                  value={avail[dk]||"none"}
                  onChange={e=>setAvail(p=>({...p,[dk]:e.target.value}))}
                  disabled={!isWindow}
                  style={{...Inp({width:"auto",padding:"6px 10px",fontSize:12}),background:avail[dk]==="none"?"#FEF2F2":avail[dk]==="both"?"#E8F8EA":"#FFF9E6",color:avail[dk]==="none"?"#EF4444":avail[dk]==="both"?"#2EAD3F":"#92400E",fontWeight:600}}
                >
                  {slotOptions.map(o=>(<option key={o.v} value={o.v}>{o.l}</option>))}
                </select>
              </div>
            );
          })}
          {isWindow&&(
            <button onClick={submit} disabled={saving} style={{...Btn("primary",{width:"100%",justifyContent:"center",padding:"12px",borderRadius:12,background:"linear-gradient(135deg,#3DB54A,#1A7A2C)",marginTop:14}),opacity:saving?.7:1}}>
              {saving?"Saving...":"📤 Submit Availability"}
            </button>
          )}
          {!isWindow&&(
            <p style={{margin:"10px 0 0",fontSize:11,color:"#6B7B6C",textAlign:"center"}}>Submission opens every Saturday 😊</p>
          )}
        </>
      )}
    </div>
  );
}

// ── Staff App ─────────────────────────────────────────────
function StaffApp({me,onLogout}){
  const[cModal,setCModal]=useState(null);
  const[showRpt,setShowRpt]=useState(false);
  const[tLeft,setTLeft]=useState(600);
  const[clocks,setClocks]=useState([]);
  const[schedules,setSchedules]=useState({});
  const[salaries,setSalaries]=useState([]);
  const tRef=useRef(null);
  const loadSchedulesSalaries=async()=>{const[sc,sl]=await Promise.all([db.getSchedules(),db.getSalaries()]);setSchedules(sc);setSalaries(sl);};
  const loadClocks=async()=>{const cl=await db.getClocks();setClocks(cl);};
  const load=async()=>{await Promise.all([loadClocks(),loadSchedulesSalaries()]);};
  useEffect(()=>{load();},[]);
  useEffect(()=>{
    // IMPORTANT: Do NOT subscribe to clock_records here
    // because the realtime event fires BEFORE Supabase commits,
    // causing a race condition that overwrites local state with stale data.
    // Clock records are managed locally + reloaded with delay after save.
    const ch=sb.channel("staff-rt")
      .on("postgres_changes",{event:"*",schema:"public",table:"schedules"},loadSchedulesSalaries)
      .on("postgres_changes",{event:"*",schema:"public",table:"sent_salaries"},loadSchedulesSalaries)
      .subscribe();
    return()=>sb.removeChannel(ch);
  },[]);
  const reset=()=>{setTLeft(600);clearInterval(tRef.current);tRef.current=setInterval(()=>setTLeft(t=>{if(t<=1){clearInterval(tRef.current);onLogout();return 0;}return t-1;}),1000);};
  useEffect(()=>{reset();const ev=["mousemove","keypress","click","touchstart"];ev.forEach(e=>window.addEventListener(e,reset));return()=>{clearInterval(tRef.current);ev.forEach(e=>window.removeEventListener(e,reset));};},[]);
  const today=new Date();
  // Use local date string to avoid UTC/Malaysia timezone mismatch
  const todayStr=`${today.getFullYear()}-${String(today.getMonth()+1).padStart(2,"0")}-${String(today.getDate()).padStart(2,"0")}`;
  const myClock=clocks.filter(r=>r.staffId===me.id);
  // Convert each record's timestamp to local date string for accurate comparison
  const toLocalDate=ts=>{if(!ts)return"";const d=new Date(ts);return`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;};
  const todayIn=myClock.find(r=>r.type==="in"&&toLocalDate(r.timestamp)===todayStr);
  const todayOut=myClock.find(r=>r.type==="out"&&toLocalDate(r.timestamp)===todayStr);
  const clocked=todayIn&&!todayOut;
  const doneToday=!!(todayIn&&todayOut);
  const monthH=(()=>{let t=0;const y=today.getFullYear(),m=today.getMonth();Object.entries(schedules).forEach(([k,sh])=>{const[ky,km]=k.split("-").map(Number);if(ky===y&&km===m+1)sh.filter(s=>s.staffId===me.id).forEach(s=>{t+=calcH(s.start,s.end);});});return t;})();
  const myWeek=weekOf(today).map(date=>({date,shifts:(schedules[toKey(date)]||[]).filter(s=>s.staffId===me.id)})).filter(d=>d.shifts.length>0);
  const mySal=salaries.filter(s=>s.staffId===me.id).sort((a,b)=>new Date(b.sentAt)-new Date(a.sentAt));
  const fmtT=s=>`${Math.floor(s/60)}:${String(s%60).padStart(2,"0")}`;
  return(
    <div style={{minHeight:"100vh",background:"#F4FBF5",fontFamily:"'DM Sans',sans-serif"}}>
      <div style={{background:"#1A2E1B",padding:"13px 20px",display:"flex",alignItems:"center",justifyContent:"space-between",position:"sticky",top:0,zIndex:100}}>
        <div style={{display:"flex",alignItems:"center",gap:10}}><img src={LOGO_ICON} width="30" style={{objectFit:"contain"}} alt=""/><div><div style={{color:"white",fontWeight:700,fontSize:14}}>Hi, {me.name} 👋</div><div style={{color:"rgba(255,255,255,.4)",fontSize:10}}>{today.toLocaleDateString("en-MY",{weekday:"long",month:"short",day:"numeric"})}</div></div></div>
        <div style={{display:"flex",alignItems:"center",gap:8}}>
          <div style={{background:"rgba(255,255,255,.1)",padding:"4px 10px",borderRadius:20,color:tLeft<=60?"#FF6B6B":"rgba(255,255,255,.55)",fontSize:11,fontWeight:600}}>⏱️ {fmtT(tLeft)}</div>
          <button onClick={onLogout} style={{background:"rgba(255,255,255,.12)",border:"1.5px solid rgba(255,255,255,.2)",borderRadius:8,padding:"7px 14px",color:"white",fontWeight:600,fontSize:12,cursor:"pointer",fontFamily:"'DM Sans',sans-serif"}}>🚪 Logout</button>
        </div>
      </div>
      <div style={{padding:"18px 16px",maxWidth:700,margin:"0 auto"}}>
        <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:12,marginBottom:16}}>
          {[{l:"Hours/Month",v:monthH.toFixed(1)+"h",c:"#2EAD3F",e:"⏱️"},{l:"Today",v:todayOut?"Done ✅":clocked?"On Shift 🟢":"Not Started",c:clocked?"#2EAD3F":todayOut?"#3B82F6":"#6B7B6C",e:"🏪"},{l:"Salary",v:mySal.length?`RM ${mySal[0].totalPay.toFixed(2)}`:"Pending",c:mySal.length?"#2EAD3F":"#6B7B6C",e:"💰"}].map((s,i)=>(
            <div key={i} style={Card({padding:"14px"})}><div style={{fontSize:10,color:"#6B7B6C",fontWeight:600,marginBottom:4,textTransform:"uppercase",letterSpacing:.5}}>{s.e} {s.l}</div><div style={{fontSize:17,fontWeight:800,color:s.c,lineHeight:1.2}}>{s.v}</div></div>
          ))}
        </div>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:14,marginBottom:16}}>
          <div style={Card()}>
            <h3 style={{margin:"0 0 12px",fontSize:14,fontWeight:700,color:"#1A2E1B"}}>⏰ Clock In / Out</h3>
            <div style={{display:"flex",justifyContent:"center",marginBottom:12}}><img src={CUP_IMG} width="62" style={{objectFit:"contain"}} alt="cup"/></div>
            {!todayIn&&!doneToday&&<button onClick={()=>setCModal("in")} style={{...Btn("primary",{width:"100%",justifyContent:"center",padding:12,borderRadius:12,background:"linear-gradient(135deg,#3DB54A,#1A7A2C)",fontSize:13})}}>🟢 Clock In</button>}
            {clocked&&!doneToday&&<button onClick={()=>setCModal("out")} style={{width:"100%",padding:12,borderRadius:12,border:"none",background:"linear-gradient(135deg,#FF6B6B,#CC3333)",color:"white",fontWeight:600,fontSize:13,cursor:"pointer",fontFamily:"'DM Sans',sans-serif"}}>🔴 Clock Out</button>}
            {doneToday&&<div style={{textAlign:"center",padding:12,background:"#E8F8EA",borderRadius:12,color:"#2EAD3F",fontWeight:600,fontSize:13}}>✅ Done for today!</div>}
            {todayIn&&<div style={{fontSize:11,color:"#6B7B6C",marginTop:6,textAlign:"center"}}>In: {new Date(todayIn.timestamp).toLocaleTimeString("en-MY",{hour:"2-digit",minute:"2-digit"})}{doneToday&&todayOut?` · Out: ${new Date(todayOut.timestamp).toLocaleTimeString("en-MY",{hour:"2-digit",minute:"2-digit"})}`:""}  </div>}
          </div>
          <div style={Card()}>
            <h3 style={{margin:"0 0 10px",fontSize:14,fontWeight:700,color:"#1A2E1B"}}>📅 This Week</h3>
            {myWeek.length===0?<p style={{color:"#6B7B6C",fontSize:13}}>No shifts this week.</p>:myWeek.map((d,i)=>(
              <div key={i} style={{padding:"5px 0",borderBottom:i<myWeek.length-1?"1px solid #D4EDD6":"none"}}>
                <div style={{fontSize:11,fontWeight:600,color:"#1A2E1B",display:"flex",alignItems:"center",gap:4}}>
                  {d.date.toLocaleDateString("en-MY",{weekday:"short",month:"short",day:"numeric"})}
                  {d.shifts.some(s=>s.isPH)&&<span style={{background:"#FEF3C7",color:"#92400E",fontSize:9,padding:"1px 5px",borderRadius:4,fontWeight:700}}>PH</span>}
                </div>
                {d.shifts.map((s,j)=><div key={j} style={{fontSize:10,color:"#6B7B6C"}}>{fmt(s.start)} – {fmt(s.end)}{s.note?` · ${s.note}`:""}</div>)}
              </div>
            ))}
          </div>
        </div>
        {mySal.length>0&&(<div style={{...Card(),marginBottom:16}}>
          <h3 style={{margin:"0 0 10px",fontSize:14,fontWeight:700,color:"#1A2E1B"}}>💰 My Salary — {MONTHS[mySal[0].month]} {mySal[0].year}</h3>
          <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:10,marginBottom:10}}>
            {[{l:"Total Hours",v:`${mySal[0].totalHours.toFixed(2)}h`,c:"#2EAD3F"},{l:"Total Pay",v:`RM ${mySal[0].totalPay.toFixed(2)}`,c:"#3B82F6"},{l:"Avg Rate",v:`RM ${mySal[0].totalHours>0?(mySal[0].totalPay/mySal[0].totalHours).toFixed(2):"0.00"}/h`,c:"#F59E0B"}].map((s,i)=>(
              <div key={i} style={{background:"#F4FBF5",borderRadius:10,padding:10,textAlign:"center"}}><div style={{fontSize:15,fontWeight:800,color:s.c}}>{s.v}</div><div style={{fontSize:10,color:"#6B7B6C",marginTop:1}}>{s.l}</div></div>
            ))}
          </div>
          {mySal[0].breakdown&&mySal[0].breakdown.length>0&&(<details><summary style={{cursor:"pointer",fontSize:12,fontWeight:600,color:"#2EAD3F"}}>View Daily Breakdown ▸</summary><div style={{marginTop:8}}>{mySal[0].breakdown.map((b,i)=>(<div key={i} style={{display:"flex",justifyContent:"space-between",padding:"5px 10px",background:"#F4FBF5",borderRadius:6,marginBottom:3,fontSize:12}}><span>{new Date(b.date).toLocaleDateString("en-MY",{weekday:"short",month:"short",day:"numeric"})}{b.isPH?" 🎉":""}</span><span style={{color:"#6B7B6C"}}>{b.hours.toFixed(2)}h @ RM{b.rate.toFixed(2)}</span><span style={{color:"#2EAD3F",fontWeight:600}}>RM {(b.hours*b.rate).toFixed(2)}</span></div>))}</div></details>)}
        </div>)}
        <AvailabilitySection staffId={me.id}/>
        <div style={Card()}>
          <h3 style={{margin:"0 0 8px",fontSize:14,fontWeight:700,color:"#1A2E1B"}}>📋 Store Report</h3>
          <p style={{color:"#6B7B6C",fontSize:12,marginBottom:12}}>Report store issues — equipment, maintenance, etc.</p>
          <button onClick={()=>setShowRpt(true)} style={{...Btn("sec",{borderRadius:10,padding:"10px 16px",color:"#F59E0B",borderColor:"#FDE68A",background:"#FFFBEB",fontSize:12})}}>📢 File a Report</button>
        </div>
        <div style={{marginTop:20,textAlign:"center"}}>
          <button onClick={onLogout} style={{...Btn("ghost",{color:"#6B7B6C",padding:"10px 24px",borderRadius:10,border:"1.5px solid #D4EDD6",background:"white",fontSize:12})}}>🚪 Sign Out</button>
        </div>
      </div>
      {cModal&&<ClockModal staffId={me.id} staffName={me.name} type={cModal} onSave={r=>{
          // Update local state immediately — this is the source of truth
          // DO NOT reload from Supabase here — it may not have committed yet
          setClocks(p=>[r,...p]);
        }} onClose={()=>setCModal(null)}/>}
      {showRpt&&<ComplaintModal staffId={me.id} staffName={me.name} onSave={r=>{}} onClose={()=>setShowRpt(false)}/>}
    </div>
  );
}

// ── Dashboard ─────────────────────────────────────────────

  const todayClocks=clockRecords.filter(r=>r.timestamp&&r.timestamp.startsWith(today.toISOString().slice(0,10)));

        <p style={{color:"rgba(255,255,255,.55)",margin:0,fontSize:13,fontStyle:"italic"}}>{q.en}</p>
      </div>
      <div style={{display:"grid",gridTemplateColumns:"repeat(2,1fr)",gap:10,marginBottom:14}}>
        {[{l:"On Shift Today",v:todayShifts.length,s:`of ${staff.length} staff`,c:"#2EAD3F",e:"👥"},{l:"Clocks Today",v:todayClocks.length,s:"records",c:"#3B82F6",e:"⏰"},{l:"Month Salary Est.",v:`RM ${monthPay.toFixed(0)}`,s:MONTHS[today.getMonth()],c:"#F59E0B",e:"💸"},{l:"Pending Reports",v:pending,s:"store issues",c:pending>0?"#EF4444":"#6B7B6C",e:"📋"}].map((s,i)=>(
          <div key={i} style={Card()}><div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start"}}><div><div style={{fontSize:19,fontWeight:700,color:s.c,marginBottom:1}}>{s.v}</div><div style={{fontSize:12,fontWeight:500,color:"#1A2E1B"}}>{s.l}</div><div style={{fontSize:10,color:"#6B7B6C",marginTop:2}}>{s.s}</div></div><span style={{fontSize:21}}>{s.e}</span></div></div>
        ))}
      </div>
      <div style={{display:"grid",gridTemplateColumns:"1fr",gap:12}}>
        <div style={Card()}><h3 style={{margin:"0 0 12px",fontSize:14,fontWeight:600,color:"#1A2E1B"}}>Today's Shifts</h3>
          {todayShifts.length===0?<p style={{color:"#6B7B6C",fontSize:13,margin:0}}>No shifts today.</p>:todayShifts.map((sh,i)=>{const s=staff.find(x=>x.id===sh.staffId);if(!s)return null;return(<div key={i} style={{display:"flex",alignItems:"center",gap:10,padding:"7px 0",borderBottom:i<todayShifts.length-1?"1px solid #D4EDD6":"none"}}><div style={{width:32,height:32,borderRadius:"50%",background:gc(s.id),display:"flex",alignItems:"center",justifyContent:"center",color:"white",fontSize:11,fontWeight:700,flexShrink:0,overflow:"hidden"}}>{s.photo?<img src={s.photo} style={{width:32,height:32,borderRadius:"50%",objectFit:"cover"}} alt=""/>:gi(s.name)}</div><div><div style={{fontSize:13,fontWeight:600,color:"#1A2E1B"}}>{s.name}{sh.isPH&&<span style={{marginLeft:4,background:"#FEF3C7",color:"#92400E",fontSize:9,padding:"1px 5px",borderRadius:4,fontWeight:700}}>PH</span>}</div><div style={{fontSize:11,color:"#6B7B6C"}}>{fmt(sh.start)} – {fmt(sh.end)}</div></div></div>);})}
        </div>

          {[{l:"Schedule",s:"Manage shifts",e:"📅",p:"schedule"},{l:"Salary",s:"Monthly summary",e:"💰",p:"salary"},{l:"Attendance",s:"Clock records",e:"⏰",p:"attendance"},{l:"Reports",s:`${pending} pending`,e:"📋",p:"reports"}].map((q,i)=>(

// ── Schedule Page (with PH toggle) ────────────────────────
function SchedulePage({staff,schedules,reload}){
  const today=new Date();
  const[view,setView]=useState("week");
  const[anchor,setAnchor]=useState(today);
  const[modal,setModal]=useState(null);
  const[ns,setNs]=useState({staffId:"",start:"10:00",end:"15:00",note:"",isPH:false});
  const[copied,setCopied]=useState("");
  const[editingShift,setEditingShift]=useState(null);
  const[showAutoModal,setShowAutoModal]=useState(false);
  const[autoData,setAutoData]=useState(null); // {weekDates, availabilities, preview}
  const[autoLoading,setAutoLoading]=useState(false);
  const[autoGenerating,setAutoGenerating]=useState(false);
  const wd=weekOf(anchor),sy=anchor.getFullYear(),sm=anchor.getMonth();
  const add=async()=>{if(!ns.staffId)return;const shift={id:Date.now().toString(),...ns};await db.addShift(toKey(modal.date),shift);reload();setNs({staffId:"",start:"10:00",end:"15:00",note:"",isPH:false});};
  const del=async(id)=>{await db.deleteShift(id);reload();};
  const saveEdit=async(oldId)=>{if(!editingShift)return;await db.deleteShift(oldId);await db.addShift(toKey(modal.date),{...editingShift,id:Date.now().toString()});setEditingShift(null);reload();};

  const openAutoModal=async()=>{
    setAutoLoading(true);setShowAutoModal(true);setAutoData(null);
    const nextMon=getNextWeekMonday();
    const weekStr=toKey(nextMon);
    const weekDates=getWeekDatesFrom(nextMon);
    const avails=await db.getAvailability(weekStr);
    // Count submissions per staff
    const submittedStaff=[...new Set(avails.map(a=>a.staffId))];
    const eligible=staff.filter(s=>!AUTO_SCHEDULE_EXCLUDED.includes(s.id));
    // Generate preview
    const{shifts:previewShifts,unfilled}=generateAutoSchedule(weekDates,avails,staff);
    setAutoData({weekDates,avails,previewShifts,unfilled,submittedStaff,eligible,weekStr});
    setAutoLoading(false);
  };

  const applyAutoSchedule=async()=>{
    if(!autoData)return;
    setAutoGenerating(true);
    const{weekDates,avails,weekStr}=autoData;
    // Regenerate fresh (random)
    const{shifts,unfilled}=generateAutoSchedule(weekDates,avails,staff);
    // Save all shifts
    await Promise.all(shifts.map(s=>db.addShift(s.date,s)));
    // Send Telegram
    const msg=buildTelegramMsg(weekDates,shifts,unfilled,staff);
    await tg(msg);
    reload();
    setAutoGenerating(false);
    setShowAutoModal(false);
    alert(`✅ Schedule generated! ${shifts.length} shifts created.${unfilled.length>0?`\n⚠️ ${unfilled.length} slots unfilled — check Telegram.`:""}`);
  };
  const genTxt=(s,y,m)=>{const lines=[`${s.name}:`];const fullDays=["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];const dim=new Date(y,m+1,0).getDate();for(let d=1;d<=dim;d++){const date=new Date(y,m,d),k=toKey(date);(schedules[k]||[]).filter(x=>x.staffId===s.id).forEach(sh=>{lines.push(`${d}/${m+1} ${fullDays[date.getDay()]} ${fmt(sh.start)} - ${fmt(sh.end)}${sh.isPH?" (PH)":""}${sh.note?` (${sh.note})`:""}`);});}return lines.join("\n");};
  const copy=s=>{navigator.clipboard.writeText(genTxt(s,sy,sm));setCopied(s.id);setTimeout(()=>setCopied(""),2000);};
  const wa=s=>{if(!s.phone){alert("No phone for "+s.name);return;}window.open(`https://wa.me/${s.phone.replace(/\D/g,"")}?text=${encodeURIComponent(genTxt(s,sy,sm))}`,"_blank");};
  const grid=()=>{const first=new Date(sy,sm,1).getDay(),off=first===0?6:first-1,dim=new Date(sy,sm+1,0).getDate(),g=[];for(let i=0;i<off;i++)g.push(null);for(let i=1;i<=dim;i++)g.push(i);return g;};
  const nav=d=>{const x=new Date(anchor);if(view==="week")x.setDate(x.getDate()+d*7);else x.setMonth(x.getMonth()+d);setAnchor(x);};
  const isT=date=>toKey(date)===toKey(today);
  return(
    <>
      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:22,flexWrap:"wrap",gap:12}}>
        <div><h1 style={{fontSize:24,fontWeight:700,color:"#1A2E1B",margin:"0 0 2px"}}>Schedule</h1><p style={{color:"#6B7B6C",margin:0,fontSize:13}}>Assign and manage staff shifts</p></div>
        <div style={{display:"flex",gap:8,alignItems:"center",flexWrap:"wrap"}}>
          <button onClick={openAutoModal} style={{...Btn("primary",{background:"linear-gradient(135deg,#8B5CF6,#6D28D9)",borderRadius:10})}}>🎲 Auto Schedule</button>
          <div style={{display:"flex",background:"white",border:"1.5px solid #D4EDD6",borderRadius:8,overflow:"hidden"}}>{["week","month"].map(v=>(<button key={v} onClick={()=>setView(v)} style={{padding:"8px 15px",border:"none",cursor:"pointer",fontSize:13,fontWeight:500,background:v===view?"#2EAD3F":"transparent",color:v===view?"white":"#6B7B6C",fontFamily:"'DM Sans',sans-serif"}}>{v.charAt(0).toUpperCase()+v.slice(1)}</button>))}</div>
          <div style={{display:"flex",alignItems:"center",gap:4,background:"white",border:"1.5px solid #D4EDD6",borderRadius:8,padding:4}}>
            <button onClick={()=>nav(-1)} style={Btn("ghost",{padding:"4px 10px"})}>‹</button>
            <span style={{fontSize:13,fontWeight:600,color:"#1A2E1B",padding:"0 8px",minWidth:155,textAlign:"center"}}>{view==="week"?`${wd[0].toLocaleDateString("en",{month:"short",day:"numeric"})} – ${wd[6].toLocaleDateString("en",{month:"short",day:"numeric",year:"numeric"})}`:`${MONTHS[sm]} ${sy}`}</span>
            <button onClick={()=>nav(1)} style={Btn("ghost",{padding:"4px 10px"})}>›</button>
          </div>
        </div>
      </div>
      {view==="week"&&(<div style={{...Card(),marginBottom:18,padding:14,overflowX:"auto"}}><div style={{display:"grid",gridTemplateColumns:"repeat(7,1fr)",gap:8,minWidth:680}}>
        {wd.map((date,i)=>{const all=schedules[toKey(date)]||[];const hasPH=all.some(s=>s.isPH);const bc=isT(date)?"#2EAD3F":"#D4EDD6",bg=isT(date)?"#E8F8EA":"white";return(<div key={i} onClick={()=>setModal({date})} style={{borderRadius:10,border:`1.5px solid ${bc}`,padding:"9px 7px",cursor:"pointer",background:bg,transition:"all .15s",minHeight:115,position:"relative"}} onMouseEnter={e=>{e.currentTarget.style.borderColor="#2EAD3F";e.currentTarget.style.background="#E8F8EA";}} onMouseLeave={e=>{e.currentTarget.style.borderColor=bc;e.currentTarget.style.background=bg;}}>
          {hasPH&&<div style={{position:"absolute",top:4,right:4,background:"#FEF3C7",color:"#92400E",fontSize:8,padding:"1px 4px",borderRadius:3,fontWeight:700}}>PH</div>}
          <div style={{fontSize:10,color:"#6B7B6C",fontWeight:500,marginBottom:1}}>{"Mon Tue Wed Thu Fri Sat Sun".split(" ")[i]}</div>
          <div style={{fontSize:17,fontWeight:700,color:isT(date)?"#2EAD3F":"#1A2E1B",marginBottom:7}}>{date.getDate()}</div>
          {all.slice(0,2).map((sh,j)=>{const s=staff.find(x=>x.id===sh.staffId);if(!s)return null;return(<div key={j} style={{fontSize:10,background:gc(s.id),color:"white",borderRadius:4,padding:"2px 5px",marginBottom:2,fontWeight:500,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{s.name.split(" ")[0]}</div>);})}
          {all.length>2&&<div style={{fontSize:10,color:"#6B7B6C"}}>+{all.length-2}</div>}
          {all.length===0&&<div style={{fontSize:10,color:"#6B7B6C",marginTop:3}}>+ Add</div>}

                </div>

            )}

          <div style={{background:"#E8F8EA",borderRadius:10,padding:14,marginTop:10}}>

            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,marginBottom:9}}>
              <div><label style={{fontSize:11,color:"#6B7B6C",fontWeight:500,display:"block",marginBottom:3}}>Start</label><input type="time" value={ns.start} onChange={e=>setNs(p=>({...p,start:e.target.value}))} style={Inp()}/></div>
              <div><label style={{fontSize:11,color:"#6B7B6C",fontWeight:500,display:"block",marginBottom:3}}>End</label><input type="time" value={ns.end} onChange={e=>setNs(p=>({...p,end:e.target.value}))} style={Inp()}/></div>

            <label style={{display:"flex",alignItems:"center",gap:8,marginBottom:12,cursor:"pointer"}}>

            <button onClick={add} disabled={!ns.staffId} style={{...Btn("primary",{width:"100%",justifyContent:"center"}),opacity:ns.staffId?1:.5}}>+ Add Shift</button>
          </div>

      {/* ── Auto Schedule Modal ── */}
      {showAutoModal&&(
        <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,.55)",display:"flex",alignItems:"center",justifyContent:"center",zIndex:300,padding:20}}>
          <div style={{background:"white",borderRadius:20,padding:28,width:500,maxHeight:"88vh",overflowY:"auto",boxShadow:"0 24px 80px rgba(0,0,0,.3)"}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:20}}>
              <div>
                <h3 style={{margin:"0 0 2px",fontSize:18,fontWeight:700,color:"#1A2E1B"}}>🎲 Auto Schedule</h3>
                {autoData&&<p style={{margin:0,fontSize:12,color:"#6B7B6C"}}>
                  Week: {autoData.weekDates[0].getDate()}/{autoData.weekDates[0].getMonth()+1} – {autoData.weekDates[6].getDate()}/{autoData.weekDates[6].getMonth()+1}
                </p>}

                <div style={{fontSize:36,marginBottom:12}}>⏳</div>
                <p style={{color:"#6B7B6C",fontSize:14}}>Loading availability data...</p>
              </div>

            {!autoLoading&&autoData&&(

                {/* Submission summary */}
                <div style={{background:"#F4FBF5",borderRadius:12,padding:"14px 16px",marginBottom:16}}>

                    })}

                </div>

                {/* Preview */}
                <p style={{margin:"0 0 10px",fontSize:13,fontWeight:600,color:"#1A2E1B"}}>📅 Preview (random — changes each generate):</p>

                  const dk=toKey(date);

                    <div key={dk} style={{marginBottom:8,padding:"10px 12px",background:"#F9FFF9",borderRadius:10,border:"1.5px solid #D4EDD6"}}>

                      </div>
                      {getSlots(date).map(({slot,label})=>{
                        const sh=autoData.previewShifts.find(s=>s.date===dk&&s.start===(slot==="morning"?(isWE?"11:00":"10:30"):"16:30"));
                        const staffName=sh?staff.find(x=>x.id===sh.staffId)?.name:null;
                        const isUnfilled=autoData.unfilled.find(u=>toKey(u.date)===dk&&u.label===label);
                        return(
                          <div key={slot} style={{display:"flex",alignItems:"center",justifyContent:"space-between",fontSize:12,marginBottom:3}}>
                            <span style={{color:"#6B7B6C"}}>{slot==="morning"?"🌅":"🌆"} {label}</span>
                            <span style={{fontWeight:600,color:staffName?"#1A2E1B":"#EF4444"}}>
                              {staffName||"⚠️ No one available"}
                            </span>
                          </div>
                        );
                      })}
                    </div>
                  );
                })}

                {autoData.unfilled.length>0&&(
                  <div style={{background:"#FEF9C3",border:"1.5px solid #FDE68A",borderRadius:10,padding:"10px 14px",marginBottom:14}}>
                    <p style={{margin:"0 0 4px",fontSize:13,fontWeight:600,color:"#92400E"}}>⚠️ {autoData.unfilled.length} slot(s) cannot be filled</p>
                    <p style={{margin:0,fontSize:12,color:"#92400E"}}>Manager will be notified via Telegram.</p>
                  </div>

                    {autoGenerating?"Generating...":"✅ Apply & Notify Telegram"}
                  </button>
                </div>
              </>
            )}
          </div>
        </div>
      )}
    </>
  );
}

// ── Salary Page ───────────────────────────────────────────
function SalaryPage({staff,schedules,sentSalaries,reload}){
  const today=new Date();
  const[sy,setSy]=useState(today.getFullYear());
  const[sm,setSm]=useState(today.getMonth());
  const[vm,setVm]=useState("boss");
  const[msg,setMsg]=useState("");

  const calcSal=sid=>{
    let th=0,tp=0;const bd=[];const dim=new Date(sy,sm+1,0).getDate();
    const st=staff.find(x=>x.id===sid);if(!st)return{totalHours:0,totalPay:0,breakdown:[],rate:0};
    for(let d=1;d<=dim;d++){
      const date=new Date(sy,sm,d),k=toKey(date);
      const sh=(schedules[k]||[]).filter(s=>s.staffId===sid);
      let dh=0,dp=0;
      sh.forEach(s=>{
        const h=calcH(s.start,s.end);
        const r=getRate(st,date,s.isPH);
        dh+=h;dp+=h*r;
      });
      if(dh>0){bd.push({date:date.toISOString(),hours:dh,pay:dp,rate:dp/dh,isPH:sh.some(s=>s.isPH),shifts:sh});th+=dh;tp+=dp;}
    }
    return{totalHours:th,totalPay:tp,breakdown:bd,rate:th>0?tp/th:0};
  };

  const all=staff.map(s=>({staff:s,...calcSal(s.id)}));
  const grand=all.reduce((s,x)=>s+x.totalPay,0);
  const grandH=all.reduce((s,x)=>s+x.totalHours,0);
  const disp=vm==="boss"?all:all.filter(x=>x.staff.id===vm);
  const selD=vm!=="boss"?disp[0]:null;
  const navM=d=>{let m=sm+d,y=sy;if(m<0){m=11;y--;}if(m>11){m=0;y++;}setSm(m);setSy(y);};

  const sendOne=async sid=>{
    const d=all.find(x=>x.staff.id===sid);if(!d)return;
    const r={id:`${sid}-${sm}-${sy}`,staffId:sid,month:sm,year:sy,totalHours:d.totalHours,totalPay:d.totalPay,breakdown:d.breakdown,rate:d.rate,sentAt:new Date().toISOString()};
    await db.upsertSalary(r);reload();
    setMsg(`✅ Salary sent to ${d.staff.name}!`);setTimeout(()=>setMsg(""),3000);
  };

  const sendAll=async()=>{
    await Promise.all(all.map(d=>db.upsertSalary({id:`${d.staff.id}-${sm}-${sy}`,staffId:d.staff.id,month:sm,year:sy,totalHours:d.totalHours,totalPay:d.totalPay,breakdown:d.breakdown,rate:d.rate,sentAt:new Date().toISOString()})));
    reload();setMsg(`✅ Salary sent to all ${staff.length} staff!`);setTimeout(()=>setMsg(""),3500);
  };

  const pdf=()=>{
    const period=`${MONTHS[sm]} ${sy}`;
    const isInd=vm!=="boss";const d=isInd?all.filter(x=>x.staff.id===vm):all;
    const rows=d.map(r=>`<tr><td>${r.staff.name}</td><td>${r.totalHours.toFixed(2)}h</td><td>RM ${r.totalPay.toFixed(2)}</td></tr>`).join("");
    const bd=isInd&&d[0]&&d[0].breakdown.length>0?`<h3>Daily Breakdown</h3><table><tr><th>Date</th><th>Hours</th><th>Rate</th><th>Type</th><th>Pay</th></tr>${d[0].breakdown.map(b=>`<tr><td>${new Date(b.date).toLocaleDateString("en-MY",{weekday:"short",month:"short",day:"numeric"})}</td><td>${b.hours.toFixed(2)}h</td><td>RM ${b.rate.toFixed(2)}/h</td><td>${b.isPH?"🎉 PH":isWeekendDay(new Date(b.date))?"Weekend":"Weekday"}</td><td>RM ${b.pay.toFixed(2)}</td></tr>`).join("")}</table>`:"";
    const h=`<!DOCTYPE html><html><head><title>Salary ${period}</title><style>body{font-family:Arial,sans-serif;padding:40px;color:#1A2E1B;}h1{color:#2EAD3F;}table{width:100%;border-collapse:collapse;margin:16px 0;}th{background:#F4FBF5;padding:10px;text-align:left;font-size:12px;color:#6B7B6C;border-bottom:2px solid #D4EDD6;}td{padding:10px;border-bottom:1px solid #EEF7EF;font-size:14px;}.tot{font-size:20px;font-weight:800;color:#2EAD3F;}</style></head><body><h1>🍋 JJ Portal — Ningji Lemon Tea</h1><h2>${period}${isInd?` — ${d[0]?.staff.name}`:""}</h2><table><tr><th>Staff</th><th>Hours</th><th>Total Pay</th></tr>${rows}${!isInd?`<tr><td><strong>TOTAL</strong></td><td>${grandH.toFixed(2)}h</td><td><strong>RM ${grand.toFixed(2)}</strong></td></tr>`:""}</table>${bd}<p class="tot">${isInd?`Total: RM ${d[0]?.totalPay.toFixed(2)||"0.00"}`:`Grand Total: RM ${grand.toFixed(2)}`}</p></body></html>`;
    const w=window.open("","_blank","width=800,height=600");if(w){w.document.write(h);w.document.close();setTimeout(()=>w.print(),400);}
  };

  return(
    <div>
      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:22,flexWrap:"wrap",gap:12}}>
        <div><h1 style={{fontSize:24,fontWeight:700,color:"#1A2E1B",margin:"0 0 2px"}}>Salary</h1><p style={{color:"#6B7B6C",margin:0,fontSize:13}}>Auto-calculates Weekday / Weekend / PH rates</p></div>
        <div style={{display:"flex",gap:8,flexWrap:"wrap"}}><button onClick={pdf} style={Btn("sec")}>🖨️ Export PDF</button><button onClick={sendAll} style={{...Btn("primary",{background:"linear-gradient(135deg,#3DB54A,#1A7A2C)"})}}>📤 Send All</button></div>
      </div>
      {msg&&<div style={{background:"#E8F8EA",border:"1.5px solid #2EAD3F",borderRadius:10,padding:"11px 16px",marginBottom:14,color:"#2EAD3F",fontWeight:600,fontSize:14}}>{msg}</div>}
      <div style={{...Card(),marginBottom:14,display:"flex",gap:12,alignItems:"center",flexWrap:"wrap"}}>
        <div style={{display:"flex",alignItems:"center",gap:5}}><button onClick={()=>navM(-1)} style={Btn("ghost",{padding:"6px 10px"})}>‹</button><span style={{fontSize:15,fontWeight:600,color:"#1A2E1B",minWidth:145,textAlign:"center"}}>{MONTHS[sm]} {sy}</span><button onClick={()=>navM(1)} style={Btn("ghost",{padding:"6px 10px"})}>›</button></div>
        <div style={{width:1,height:26,background:"#D4EDD6"}}/>
        <select value={vm} onChange={e=>setVm(e.target.value)} style={{...Inp({width:"auto",padding:"8px 12px"})}}><option value="boss">👑 Boss View — All Staff</option>{staff.map(s=><option key={s.id} value={s.id}>{s.name}</option>)}</select>
      </div>
      <div style={{...Card({padding:0,overflow:"hidden"}),marginBottom:14}}>
        <table style={{width:"100%",borderCollapse:"collapse"}}>
          <thead><tr style={{background:"#F4FBF5"}}>{["Staff","Hours","Total Pay","Action"].map(h=>(<th key={h} style={{padding:"11px 15px",textAlign:"left",fontSize:12,fontWeight:600,color:"#6B7B6C",borderBottom:"1.5px solid #D4EDD6"}}>{h}</th>))}</tr></thead>
          <tbody>{disp.map((d,i)=>(<tr key={d.staff.id} style={{borderBottom:i<disp.length-1?"1px solid #D4EDD6":"none"}}>
            <td style={{padding:"13px 15px"}}><div style={{display:"flex",alignItems:"center",gap:9}}><div style={{width:30,height:30,borderRadius:"50%",background:gc(d.staff.id),display:"flex",alignItems:"center",justifyContent:"center",color:"white",fontSize:10,fontWeight:700,flexShrink:0,overflow:"hidden"}}>{d.staff.photo?<img src={d.staff.photo} style={{width:30,height:30,borderRadius:"50%",objectFit:"cover"}} alt=""/>:gi(d.staff.name)}</div><span style={{fontSize:14,fontWeight:500,color:"#1A2E1B"}}>{d.staff.name}</span></div></td>
            <td style={{padding:"13px 15px",fontSize:14,color:"#1A2E1B"}}>{d.totalHours.toFixed(2)}h</td>
            <td style={{padding:"13px 15px"}}><span style={{fontSize:15,fontWeight:700,color:"#2EAD3F"}}>RM {d.totalPay.toFixed(2)}</span></td>
            <td style={{padding:"13px 15px"}}><button onClick={()=>sendOne(d.staff.id)} style={{...Btn("sec",{padding:"6px 12px",fontSize:12,color:"#2EAD3F"})}}>📤 Send</button></td>
          </tr>))}</tbody>
          {vm==="boss"&&(<tfoot><tr style={{background:"#E8F8EA",borderTop:"2px solid #2EAD3F"}}><td style={{padding:"13px 15px",fontWeight:700,fontSize:14}}>TOTAL</td><td style={{padding:"13px 15px",fontWeight:700,fontSize:14}}>{grandH.toFixed(2)}h</td><td style={{padding:"13px 15px"}}><span style={{fontSize:17,fontWeight:800,color:"#2EAD3F"}}>RM {grand.toFixed(2)}</span></td><td/></tr></tfoot>)}
        </table>
      </div>
      {selD&&selD.breakdown.length>0&&(<div style={Card()}>
        <h3 style={{margin:"0 0 12px",fontSize:14,fontWeight:600,color:"#1A2E1B"}}>Daily Breakdown — {selD.staff.name}</h3>
        <div style={{...Card({padding:"10px 14px",background:"#F4FBF5",marginBottom:12}),display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:8}}>
          {[{l:"Weekday",v:`RM ${selD.staff.rateWeekday||0}`},{l:"Weekend",v:`RM ${selD.staff.rateWeekend||0}`},{l:"PH Weekday",v:`RM ${selD.staff.ratePHWeekday||0}`},{l:"PH Weekend",v:`RM ${selD.staff.ratePHWeekend||0}`}].map((r,i)=>(<div key={i} style={{textAlign:"center"}}><div style={{fontSize:13,fontWeight:700,color:"#2EAD3F"}}>{r.v}/h</div><div style={{fontSize:10,color:"#6B7B6C"}}>{r.l}</div></div>))}
        </div>
        {selD.breakdown.map((b,i)=>(<div key={i} style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"8px 10px",background:b.isPH?"#FFFBEB":"#F4FBF5",borderRadius:8,marginBottom:4,border:b.isPH?"1.5px solid #FDE68A":"none"}}>
          <div>
            <div style={{fontSize:13,fontWeight:500,color:"#1A2E1B"}}>{new Date(b.date).toLocaleDateString("en-MY",{weekday:"short",month:"short",day:"numeric"})}{b.isPH&&<span style={{marginLeft:5,fontSize:10,color:"#92400E"}}>🎉 PH</span>}</div>
            <div style={{fontSize:11,color:"#6B7B6C"}}>{getRateLabel(new Date(b.date),b.isPH)} · RM {b.rate.toFixed(2)}/h</div>
          </div>
          <div style={{textAlign:"right"}}>
            <div style={{fontSize:13,fontWeight:600,color:"#1A2E1B"}}>{b.hours.toFixed(2)}h</div>
            <div style={{fontSize:12,color:"#2EAD3F",fontWeight:600}}>RM {b.pay.toFixed(2)}</div>
          </div>
        </div>))}
      </div>)}
    </div>
  );
}

// ── Staff Page ────────────────────────────────────────────
function StaffPage({staff,reload}){

  const openEdit=s=>{setForm({...s,rateWeekday:String(s.rateWeekday||""),rateWeekend:String(s.rateWeekend||""),ratePHWeekday:String(s.ratePHWeekday||""),ratePHWeekend:String(s.ratePHWeekend||"")});setModal("edit");};
  const remove=async id=>{if(window.confirm("Remove this staff member?")){await db.deleteStaff(id);reload();}};
  const save=async()=>{if(!form.name.trim())return;const data={...form,rateWeekday:parseFloat(form.rateWeekday)||0,rateWeekend:parseFloat(form.rateWeekend)||0,ratePHWeekday:parseFloat(form.ratePHWeekday)||0,ratePHWeekend:parseFloat(form.ratePHWeekend)||0,hourlyRate:parseFloat(form.rateWeekday)||0};await db.upsertStaff(data);reload();setModal(null);};
  const photo=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>setForm(p=>({...p,photo:r.result}));r.readAsDataURL(f);};
  const Fld=(label,key,type="text",ph="")=>(<div style={{marginBottom:10}}><label style={{fontSize:12,fontWeight:500,color:"#6B7B6C",display:"block",marginBottom:3}}>{label}</label><input type={type} placeholder={ph} value={form[key]||""} onChange={e=>setForm(p=>({...p,[key]:e.target.value}))} style={Inp()}/></div>);
  return(
    <div>
      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:22}}><div><h1 style={{fontSize:24,fontWeight:700,color:"#1A2E1B",margin:"0 0 2px"}}>Staff</h1><p style={{color:"#6B7B6C",margin:0,fontSize:13}}>{staff.length} team members</p></div><button onClick={openAdd} style={Btn("primary")}>+ Add Staff</button></div>
      <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(280px,1fr))",gap:14}}>
        {staff.map(s=>(<div key={s.id} style={Card()}>
          <div style={{display:"flex",alignItems:"center",gap:12,marginBottom:12}}><div style={{width:50,height:50,borderRadius:"50%",background:gc(s.id),display:"flex",alignItems:"center",justifyContent:"center",color:"white",fontSize:16,fontWeight:700,flexShrink:0,overflow:"hidden"}}>{s.photo?<img src={s.photo} style={{width:50,height:50,objectFit:"cover"}} alt=""/>:gi(s.name)}</div><div><div style={{fontSize:15,fontWeight:700,color:"#1A2E1B"}}>{s.name}</div></div></div>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:6,marginBottom:12,background:"#F4FBF5",borderRadius:8,padding:"10px"}}>
            {[["Weekday",s.rateWeekday],["Weekend",s.rateWeekend],["PH Weekday",s.ratePHWeekday],["PH Weekend",s.ratePHWeekend]].map(([l,v],i)=>(<div key={i} style={{textAlign:"center"}}><div style={{fontSize:13,fontWeight:700,color:"#2EAD3F"}}>RM {parseFloat(v||0).toFixed(2)}</div><div style={{fontSize:9,color:"#6B7B6C"}}>{l}/h</div></div>))}
          </div>
          <div style={{display:"flex",flexDirection:"column",gap:4,marginBottom:12}}>{[["📱",s.phone||"—"],["🪪",s.ic||"—"],["🆘",s.emergency||"—"],["📅",s.dateJoined||"—"]].map(([ic,v],i)=>(<div key={i} style={{display:"flex",gap:7,fontSize:11}}><span>{ic}</span><span style={{color:v==="—"?"#6B7B6C":"#1A2E1B"}}>{v}</span></div>))}</div>
          <div style={{display:"flex",gap:8}}><button onClick={()=>openEdit(s)} style={{...Btn("sec",{flex:1,justifyContent:"center"}),fontSize:12}}>✏️ Edit</button><button onClick={()=>remove(s.id)} style={{...Btn("danger",{padding:"8px 12px"}),fontSize:12}}>🗑️</button></div>
        </div>))}
      </div>
      {modal&&(<div style={{position:"fixed",inset:0,background:"rgba(0,0,0,.4)",display:"flex",alignItems:"center",justifyContent:"center",zIndex:200,padding:20}}><div style={{background:"white",borderRadius:16,padding:26,width:420,maxHeight:"90vh",overflowY:"auto",boxShadow:"0 20px 60px rgba(0,0,0,.2)"}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:18}}><h3 style={{margin:0,fontSize:17,fontWeight:700,color:"#1A2E1B"}}>{modal==="add"?"Add Staff":"Edit Staff"}</h3><button onClick={()=>setModal(null)} style={{background:"none",border:"none",cursor:"pointer",fontSize:20,color:"#6B7B6C"}}>✕</button></div>
        <div style={{textAlign:"center",marginBottom:14}}><div style={{width:64,height:64,borderRadius:"50%",background:gc(form.id||"1"),display:"inline-flex",alignItems:"center",justifyContent:"center",color:"white",fontSize:20,fontWeight:700,marginBottom:6,overflow:"hidden"}}>{form.photo?<img src={form.photo} style={{width:64,height:64,objectFit:"cover"}} alt=""/>:gi(form.name||"?")}</div><div><label style={{cursor:"pointer",fontSize:12,color:"#2EAD3F",fontWeight:600}}>📷 Upload Photo<input type="file" accept="image/*" onChange={photo} style={{display:"none"}}/></label></div></div>
        {Fld("Full Name *","name","text","e.g. Muni")}
        {Fld("Phone","phone","text","e.g. 601112345678")}
        {Fld("IC Number","ic","text")}
        {Fld("Emergency Contact","emergency","text")}
        {Fld("Date Joined","dateJoined","date")}
        <div style={{background:"#E8F8EA",borderRadius:10,padding:"12px",marginBottom:10}}>
          <p style={{fontSize:12,fontWeight:700,color:"#1A2E1B",margin:"0 0 10px"}}>💰 Hourly Rates (RM)</p>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8}}>
            {Fld("Weekday","rateWeekday","number","e.g. 12.50")}
            {Fld("Weekend","rateWeekend","number","e.g. 13.50")}
            {Fld("PH Weekday","ratePHWeekday","number","e.g. 14.50")}
            {Fld("PH Weekend","ratePHWeekend","number","e.g. 15.50")}
          </div>
        </div>
        <div style={{display:"flex",gap:10}}><button onClick={()=>setModal(null)} style={{...Btn("sec",{flex:1,justifyContent:"center"})}}>Cancel</button><button onClick={save} disabled={!form.name?.trim()} style={{...Btn("primary",{flex:2,justifyContent:"center"}),opacity:form.name?.trim()?1:.5}}>{modal==="add"?"Add Staff":"Save Changes"}</button></div>
      </div></div>)}
    </div>
  );
}


// ── Lazy Photo Component ──────────────────────────────────
function LazyPhoto({recordId,onClick}){
  const[photo,setPhoto]=useState(null);
  const[loading,setLoading]=useState(false);
  const load=async()=>{
    if(photo||loading)return;
    setLoading(true);
    const p=await db.getClockPhoto(recordId);
    setPhoto(p);setLoading(false);
  };
  useEffect(()=>{load();},[]);
  if(loading)return<div style={{width:56,height:56,borderRadius:8,background:"#F4FBF5",display:"flex",alignItems:"center",justifyContent:"center",fontSize:18}}>⏳</div>;
  if(!photo)return null;
  return<img src={photo} onClick={()=>onClick(photo)} style={{width:56,height:56,objectFit:"cover",borderRadius:8,cursor:"pointer",border:"2px solid #D4EDD6"}} alt=""/>;
}

// ── Attendance Page ───────────────────────────────────────
function AttendancePage({staff,clockRecords,reload}){
  const[fs,setFs]=useState("all");
  const[fd,setFd]=useState("");
  const[noteModal,setNoteModal]=useState(null);
  const[noteText,setNoteText]=useState("");
  const[imgModal,setImgModal]=useState(null);
  const filtered=clockRecords.filter(r=>(fs==="all"||r.staffId===fs)&&(!fd||r.timestamp.startsWith(fd))).sort((a,b)=>new Date(b.timestamp)-new Date(a.timestamp));
  const grouped=filtered.reduce((acc,r)=>{const d=r.timestamp.slice(0,10);if(!acc[d])acc[d]=[];acc[d].push(r);return acc;},{});
  const saveNote=async(id,note)=>{await db.updateClockNote(id,note);reload();setNoteModal(null);};
  return(
    <div>
      <div style={{marginBottom:22}}><h1 style={{fontSize:24,fontWeight:700,color:"#1A2E1B",margin:"0 0 2px"}}>Attendance</h1><p style={{color:"#6B7B6C",margin:0,fontSize:13}}>{clockRecords.length} total records</p></div>
      <div style={{...Card(),marginBottom:14,display:"flex",gap:12,flexWrap:"wrap",alignItems:"center"}}>
        <select value={fs} onChange={e=>setFs(e.target.value)} style={{...Inp({width:"auto",padding:"8px 12px"})}}><option value="all">All Staff</option>{staff.map(s=><option key={s.id} value={s.id}>{s.name}</option>)}</select>
        <input type="date" value={fd} onChange={e=>setFd(e.target.value)} style={{...Inp({width:"auto",padding:"8px 12px"})}}/>
        {(fs!=="all"||fd)&&<button onClick={()=>{setFs("all");setFd("");}} style={Btn("ghost",{fontSize:12})}>✕ Clear</button>}
      </div>
      {Object.keys(grouped).length===0?(<div style={{...Card(),textAlign:"center",padding:48}}><div style={{fontSize:48,marginBottom:12}}>⏰</div><p style={{color:"#6B7B6C",fontSize:14}}>No records found</p></div>):
        Object.entries(grouped).map(([date,records])=>(<div key={date} style={{...Card(),marginBottom:12}}>
          <h3 style={{margin:"0 0 12px",fontSize:12,fontWeight:700,color:"#6B7B6C",textTransform:"uppercase",letterSpacing:.5}}>{new Date(date+"T12:00:00").toLocaleDateString("en-MY",{weekday:"long",year:"numeric",month:"long",day:"numeric"})}</h3>
          {records.map((r,i)=>{const s=staff.find(x=>x.id===r.staffId);if(!s)return null;return(<div key={r.id} style={{display:"flex",alignItems:"center",gap:11,padding:"10px 0",borderBottom:i<records.length-1?"1px solid #D4EDD6":"none",flexWrap:"wrap"}}>
            <div style={{width:34,height:34,borderRadius:"50%",background:gc(s.id),display:"flex",alignItems:"center",justifyContent:"center",color:"white",fontSize:11,fontWeight:700,flexShrink:0,overflow:"hidden"}}>{s.photo?<img src={s.photo} style={{width:34,height:34,borderRadius:"50%",objectFit:"cover"}} alt=""/>:gi(s.name)}</div>
            <div style={{flex:1,minWidth:110}}><div style={{fontSize:14,fontWeight:600,color:"#1A2E1B"}}>{s.name}</div><div style={{fontSize:12,color:r.type==="in"?"#2EAD3F":"#EF4444",fontWeight:500}}>{r.type==="in"?"🟢 Clock In":"🔴 Clock Out"} · {new Date(r.timestamp).toLocaleTimeString("en-MY",{hour:"2-digit",minute:"2-digit"})}</div>{r.note&&<div style={{fontSize:11,color:"#6B7B6C"}}>Note: {r.note}</div>}{r.managerNote&&<div style={{fontSize:11,color:"#F59E0B"}}>📌 {r.managerNote}</div>}</div>
            {r.hasPhoto!==false&&<LazyPhoto recordId={r.id} onClick={(photo)=>setImgModal(photo)}/>}
            <button onClick={()=>{setNoteModal(r.id);setNoteText(r.managerNote||"");}} style={{...Btn("ghost",{padding:"5px 9px",fontSize:11})}}>📌 Note</button>
          </div>);})}
        </div>))}
      {noteModal&&(<div style={{position:"fixed",inset:0,background:"rgba(0,0,0,.4)",display:"flex",alignItems:"center",justifyContent:"center",zIndex:200}}><div style={{background:"white",borderRadius:16,padding:26,width:340,boxShadow:"0 20px 60px rgba(0,0,0,.2)"}}><h3 style={{margin:"0 0 14px",fontSize:16,fontWeight:700,color:"#1A2E1B"}}>📌 Manager Note</h3><textarea placeholder="Add note..." value={noteText} onChange={e=>setNoteText(e.target.value)} style={{...Inp(),height:85,resize:"none",marginBottom:12}}/><div style={{display:"flex",gap:10}}><button onClick={()=>setNoteModal(null)} style={{...Btn("sec",{flex:1,justifyContent:"center"})}}>Cancel</button><button onClick={()=>saveNote(noteModal,noteText)} style={{...Btn("primary",{flex:2,justifyContent:"center"})}}>Save</button></div></div></div>)}
      {imgModal&&(<div onClick={()=>setImgModal(null)} style={{position:"fixed",inset:0,background:"rgba(0,0,0,.88)",display:"flex",alignItems:"center",justifyContent:"center",zIndex:400,cursor:"pointer"}}><img src={imgModal} style={{maxWidth:"90vw",maxHeight:"90vh",borderRadius:12}} alt=""/></div>)}
    </div>
  );
}

// ── Reports Page ──────────────────────────────────────────
function ReportsPage({complaints,reload,staff}){
  const[filter,setFilter]=useState("all");
  const[imgModal,setImgModal]=useState(null);
  const filtered=complaints.filter(c=>filter==="all"||(filter==="pending"&&!c.resolved)||(filter==="resolved"&&c.resolved)).sort((a,b)=>new Date(b.timestamp)-new Date(a.timestamp));
  const resolve=async id=>{await db.resolveComplaint(id);reload();};
  return(
    <div>
      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:22,flexWrap:"wrap",gap:12}}>
        <div><h1 style={{fontSize:24,fontWeight:700,color:"#1A2E1B",margin:"0 0 2px"}}>Store Reports</h1><p style={{color:"#6B7B6C",margin:0,fontSize:13}}>{complaints.filter(c=>!c.resolved).length} pending · {complaints.filter(c=>c.resolved).length} resolved</p></div>
        <div style={{display:"flex",background:"white",border:"1.5px solid #D4EDD6",borderRadius:8,overflow:"hidden"}}>{[["all","All"],["pending","Pending"],["resolved","Resolved"]].map(([v,l])=>(<button key={v} onClick={()=>setFilter(v)} style={{padding:"8px 13px",border:"none",cursor:"pointer",fontSize:12,fontWeight:500,background:v===filter?"#2EAD3F":"transparent",color:v===filter?"white":"#6B7B6C",fontFamily:"'DM Sans',sans-serif"}}>{l}</button>))}</div>
      </div>
      {filtered.length===0?(<div style={{...Card(),textAlign:"center",padding:48}}><div style={{fontSize:48,marginBottom:12}}>📋</div><p style={{color:"#6B7B6C",fontSize:14}}>No reports found</p></div>):
        filtered.map(c=>{const s=staff.find(x=>x.id===c.staffId);return(<div key={c.id} style={{...Card(),marginBottom:12,borderLeft:`4px solid ${c.resolved?"#2EAD3F":"#F59E0B"}`}}>
          <div style={{display:"flex",alignItems:"flex-start",gap:11,flexWrap:"wrap"}}>
            <div style={{flex:1,minWidth:180}}><div style={{display:"flex",alignItems:"center",gap:8,marginBottom:8}}><div style={{width:30,height:30,borderRadius:"50%",background:s?gc(s.id):"#ccc",display:"flex",alignItems:"center",justifyContent:"center",color:"white",fontSize:10,fontWeight:700}}>{s?gi(s.name):"?"}</div><div><div style={{fontSize:14,fontWeight:600,color:"#1A2E1B"}}>{c.staffName||s?.name||"Unknown"}</div><div style={{fontSize:11,color:"#6B7B6C"}}>{new Date(c.timestamp).toLocaleString("en-MY",{month:"short",day:"numeric",hour:"2-digit",minute:"2-digit"})}</div></div><span style={{marginLeft:"auto",padding:"3px 9px",borderRadius:20,fontSize:11,fontWeight:700,background:c.resolved?"#E8F8EA":"#FEF9C3",color:c.resolved?"#2EAD3F":"#92400E"}}>{c.resolved?"✅ Resolved":"⏳ Pending"}</span></div><p style={{fontSize:14,color:"#1A2E1B",margin:"0 0 6px",lineHeight:1.5}}>{c.note}</p></div>
            <div style={{display:"flex",flexDirection:"column",gap:8,alignItems:"flex-end"}}>{c.photo&&<img src={c.photo} onClick={()=>setImgModal(c.photo)} style={{width:76,height:76,objectFit:"cover",borderRadius:10,cursor:"pointer",border:"2px solid #D4EDD6"}} alt=""/>}{!c.resolved&&<button onClick={()=>resolve(c.id)} style={{...Btn("primary",{padding:"7px 13px",fontSize:12,background:"linear-gradient(135deg,#3DB54A,#1A7A2C)"})}}>✅ Resolve</button>}</div>
          </div>
        </div>);})}
      {imgModal&&(<div onClick={()=>setImgModal(null)} style={{position:"fixed",inset:0,background:"rgba(0,0,0,.88)",display:"flex",alignItems:"center",justifyContent:"center",zIndex:400,cursor:"pointer"}}><img src={imgModal} style={{maxWidth:"90vw",maxHeight:"90vh",borderRadius:12}} alt=""/></div>)}
    </div>
  );
}

// ── Accounts Page ─────────────────────────────────────────
function AccountsPage({staffAccounts,reload,staff}){
  const[editId,setEditId]=useState(null);
  const[form,setForm]=useState({username:"",password:""});
  const[showPw,setShowPw]=useState({});
  const open=acc=>{setEditId(acc.staff_id);setForm({username:acc.username,password:acc.password});};
  const save=async()=>{await db.upsertAccount({staffId:editId,...form});reload();setEditId(null);};
  return(
    <div>
      <div style={{marginBottom:22}}><h1 style={{fontSize:24,fontWeight:700,color:"#1A2E1B",margin:"0 0 2px"}}>Staff Accounts</h1><p style={{color:"#6B7B6C",margin:0,fontSize:13}}>Manage login credentials</p></div>
      <div style={{...Card({padding:0,overflow:"hidden"})}}>
        <table style={{width:"100%",borderCollapse:"collapse"}}>
          <thead><tr style={{background:"#F4FBF5"}}>{["Staff","Username","Password","Action"].map(h=>(<th key={h} style={{padding:"11px 15px",textAlign:"left",fontSize:12,fontWeight:600,color:"#6B7B6C",borderBottom:"1.5px solid #D4EDD6"}}>{h}</th>))}</tr></thead>
          <tbody>{staffAccounts.map((acc,i)=>{const s=staff.find(x=>x.id===acc.staff_id);return(<tr key={acc.staff_id} style={{borderBottom:i<staffAccounts.length-1?"1px solid #D4EDD6":"none"}}>
            <td style={{padding:"13px 15px"}}><div style={{display:"flex",alignItems:"center",gap:9}}><div style={{width:30,height:30,borderRadius:"50%",background:s?gc(s.id):"#ccc",display:"flex",alignItems:"center",justifyContent:"center",color:"white",fontSize:10,fontWeight:700}}>{s?gi(s.name):"?"}</div><span style={{fontSize:14,fontWeight:500,color:"#1A2E1B"}}>{s?.name||"Unknown"}</span></div></td>
            <td style={{padding:"13px 15px",fontSize:13,fontFamily:"monospace",color:"#1A2E1B"}}>{acc.username}</td>
            <td style={{padding:"13px 15px"}}><div style={{display:"flex",alignItems:"center",gap:6}}><span style={{fontFamily:"monospace",fontSize:13,color:"#6B7B6C"}}>{showPw[acc.staff_id]?acc.password:"••••••••"}</span><button onClick={()=>setShowPw(p=>({...p,[acc.staff_id]:!p[acc.staff_id]}))} style={{background:"none",border:"none",cursor:"pointer",fontSize:12,color:"#6B7B6C"}}>{showPw[acc.staff_id]?"🙈":"👁️"}</button></div></td>
            <td style={{padding:"13px 15px"}}><button onClick={()=>open(acc)} style={{...Btn("sec",{padding:"6px 12px",fontSize:12})}}>✏️ Edit</button></td>
          </tr>);})}</tbody>
        </table>
      </div>
      {editId&&(<div style={{position:"fixed",inset:0,background:"rgba(0,0,0,.4)",display:"flex",alignItems:"center",justifyContent:"center",zIndex:200}}><div style={{background:"white",borderRadius:16,padding:26,width:360,boxShadow:"0 20px 60px rgba(0,0,0,.2)"}}><h3 style={{margin:"0 0 14px",fontSize:17,fontWeight:700,color:"#1A2E1B"}}>Edit — {staff.find(s=>s.id===editId)?.name}</h3><div style={{marginBottom:11}}><label style={{fontSize:12,fontWeight:500,color:"#6B7B6C",display:"block",marginBottom:3}}>Username</label><input type="text" value={form.username} onChange={e=>setForm(p=>({...p,username:e.target.value}))} style={Inp()} autoCapitalize="none"/></div><div style={{marginBottom:14}}><label style={{fontSize:12,fontWeight:500,color:"#6B7B6C",display:"block",marginBottom:3}}>Password</label><input type="text" value={form.password} onChange={e=>setForm(p=>({...p,password:e.target.value}))} style={Inp()}/></div><div style={{display:"flex",gap:10}}><button onClick={()=>setEditId(null)} style={{...Btn("sec",{flex:1,justifyContent:"center"})}}>Cancel</button><button onClick={save} style={{...Btn("primary",{flex:2,justifyContent:"center"})}}>Save</button></div></div></div>)}
    </div>
  );
}

// ── Main App ──────────────────────────────────────────────
function App(){
  const[ut,setUt]=useState(null);
  const[me,setMe]=useState(null);
  const[page,setPage]=useState("dashboard");
  const[exp,setExp]=useState(false);
  const[loading,setLoading]=useState(true);
  const[staff,setStaff]=useState([]);
  const[schedules,setSchedules]=useState({});
  const[clocks,setClocks]=useState([]);
  const[complaints,setComplaints]=useState([]);
  const[salaries,setSalaries]=useState([]);
  const[accounts,setAccounts]=useState([]);
  const[isMobile,setIsMobile]=useState(window.innerWidth<768);

  const loadAll=async()=>{
    const[st,sc,cl,cp,sl,ac]=await Promise.all([db.getStaff(),db.getSchedules(),db.getClocks(),db.getComplaints(),db.getSalaries(),db.getAccounts()]);
    if(st.length===0){
      await Promise.all(DSTAFF.map(s=>db.upsertStaff(s)));
      await Promise.all(DACCS.map(a=>db.upsertAccount(a)));
      const[st2,ac2]=await Promise.all([db.getStaff(),db.getAccounts()]);
      setStaff(st2);setAccounts(ac2);
    }else{setStaff(st);setAccounts(ac);}
    setSchedules(sc);setClocks(cl);setComplaints(cp);setSalaries(sl);
    setLoading(false);
  };

  useEffect(()=>{loadAll();},[]);
  useEffect(()=>{const h=()=>setIsMobile(window.innerWidth<768);window.addEventListener("resize",h);return()=>window.removeEventListener("resize",h);},[]);

  useEffect(()=>{
    if(ut!=="manager")return;
    const ch=sb.channel("mgr-rt")
      .on("postgres_changes",{event:"*",schema:"public",table:"clock_records"},loadAll)
      .on("postgres_changes",{event:"*",schema:"public",table:"complaints"},loadAll)
      .on("postgres_changes",{event:"*",schema:"public",table:"schedules"},loadAll)
      .on("postgres_changes",{event:"*",schema:"public",table:"sent_salaries"},loadAll)
      .on("postgres_changes",{event:"*",schema:"public",table:"staff"},loadAll)
      .subscribe();
    return()=>sb.removeChannel(ch);
  },[ut]);

  const login=(type,staffMember)=>{setUt(type);setMe(staffMember);setPage("dashboard");};
  const logout=()=>{setUt(null);setMe(null);setPage("dashboard");};

  if(loading)return <LoadingScreen/>;
  if(!ut)return <LoginPage onLogin={login}/>;
  if(ut==="staff"&&me)return <StaffApp me={me} onLogout={logout}/>;

  return(
    <div style={{display:"flex",height:"100vh",background:"#F4FBF5",fontFamily:"'DM Sans',sans-serif",overflow:"hidden"}}>
      <style>{`::-webkit-scrollbar{width:5px;}::-webkit-scrollbar-thumb{background:#C8DFC9;border-radius:3px;}`}</style>
      {!isMobile&&<Sidebar page={page} setPage={setPage} exp={exp} setExp={setExp} onLogout={logout}/>}
      <main style={{flex:1,overflowY:"auto",padding:isMobile?"14px 14px 80px":"26px 30px"}}>
        {isMobile&&(
          <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:16,background:"#1A2E1B",margin:"-14px -14px 16px",padding:"12px 16px"}}>
            <img src={LOGO_ICON} width="28" style={{objectFit:"contain"}} alt=""/>
            <div style={{color:"white",fontWeight:700,fontSize:14}}>JJ Portal</div>
            <div style={{marginLeft:"auto",color:"rgba(255,255,255,.4)",fontSize:12}}>{NAV.find(n=>n.id===page)?.ic} {NAV.find(n=>n.id===page)?.lb}</div>
          </div>
        )}
        {page==="dashboard"&&<Dashboard staff={staff} schedules={schedules} setPage={setPage} clockRecords={clocks} complaints={complaints} isMobile={isMobile}/>}
        {page==="schedule"&&<SchedulePage staff={staff} schedules={schedules} reload={loadAll} isMobile={isMobile}/>}
        {page==="salary"&&<SalaryPage staff={staff} schedules={schedules} sentSalaries={salaries} reload={loadAll} isMobile={isMobile}/>}
        {page==="staff"&&<StaffPage staff={staff} reload={loadAll}/>}
        {page==="attendance"&&<AttendancePage staff={staff} clockRecords={clocks} reload={loadAll}/>}
        {page==="reports"&&<ReportsPage complaints={complaints} reload={loadAll} staff={staff}/>}
        {page==="accounts"&&<AccountsPage staffAccounts={accounts} reload={loadAll} staff={staff}/>}
      </main>
      {isMobile&&<MobileNav page={page} setPage={setPage} onLogout={logout}/>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
